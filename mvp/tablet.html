<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- 홈 화면에 추가하면 주소창 없이 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Weave 태블릿" />
    <title>Weave · 태블릿</title>
  </head>
  <body class="tablet">
    <div class="view" id="view"></div>

    <!-- D2: 디자인 없이 회색 버튼만. 실제 UI는 D4에 Figma 기준으로 교체 -->
    <div class="toolbar">
      <div class="presets" role="group" aria-label="재질 조합">
        <button type="button" data-preset="white">화이트</button>
        <button type="button" data-preset="A">A</button>
        <button type="button" data-preset="B">B</button>
        <button type="button" data-preset="C">C</button>
      </div>
      <div class="debug">
        <button type="button" id="grid" aria-pressed="false">방위 격자</button>
        <button type="button" id="drop">5초 끊기</button>
        <button type="button" id="reset">리셋</button>
      </div>
    </div>
    <div class="readout" id="readout"></div>

    <script type="module" src="/src/tablet/main.js"></script>
  </body>
</html>
