<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- 홈 화면에 추가하면 주소창 없이 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Weave 태블릿" />
    <title>Weave · 태블릿</title>
  </head>
  <body class="tablet">
    <!-- 파노라마(화면 전체) -->
    <div class="view" id="view"></div>
    <!-- 공간에 붙는 표시: 바닥 화살표, 치수, 체크 위치 (화면 px) -->
    <div class="anchor-layer" id="anchors"></div>

    <!-- UI: Figma 매니저 프레임(2264×1292) 좌표. 화면 높이에 맞춰 축소하고, 좌우는 화면 폭만큼 늘어난다 -->
    <div class="ui" id="ui">
      <!-- 시작화면 (Figma 1433:3379) -->
      <!-- 시작화면 (Figma 1254:765). 배경은 Figma에서 글자를 뺀 사진(assets/cover/intro-bg.jpg) -->
      <section class="start" id="start">
        <img class="start-bg" src="/assets/cover/intro-bg.jpg" alt="" />
        <img class="start-logo" src="/assets/cover/weave-logo-white.svg" alt="오늘의집 Weave" />
        <p class="start-sub">Weave 매니저가 되어 고객의 반셀프<br />인테리어 상담을 도와주세요</p>
        <button type="button" class="start-btn is-primary" data-target="start" data-value="play">시작하기<img src="/assets/ui/figma/cta-arrow.svg" alt="" /></button>
        <button type="button" class="start-btn" data-target="start" data-value="tutorial">튜토리얼보기<img src="/assets/cover/arrow-dark.svg" alt="" /></button>
      </section>

      <!-- 프롤로그 3장 (Figma 1433:3453 · 1433:3463 · 1433:3469). 화면을 누르면 다음 장. 본문은 scenario.js의 copy -->
      <section class="prologue" id="prologue" hidden>
        <button type="button" class="pro-header" id="proBack" data-free>
          <img src="/assets/ui/figma/prologue-back.svg" alt="" />Prologue
        </button>
        <div class="pro-frame" data-target="prologue-next" id="proFrame">
          <div class="pro-page" data-page="1">
            <div class="pro-img is-wire">img</div>
            <p class="pro-text"></p>
          </div>
          <div class="pro-page" data-page="2">
            <img class="pro-photo pro-photo-l" src="/assets/ui/figma/prologue-scan.jpg" alt="" />
            <img class="pro-arrow" src="/assets/ui/figma/prologue-arrow.svg" alt="" />
            <img class="pro-photo pro-photo-r" src="/assets/ui/figma/prologue-store.jpg" alt="" />
            <p class="pro-text"></p>
          </div>
          <div class="pro-page" data-page="3">
            <div class="pro-img is-wire"><span>상담요청서img</span><b>고객: 김민선 · 의뢰: 주방에 아일랜드 놓기</b></div>
            <p class="pro-text"></p>
          </div>
        </div>
        <button type="button" class="cta-btn pro-cta" id="proCta" data-target="prologue-start">상담 플로우 시작하기<img src="/assets/ui/figma/cta-arrow.svg" alt="" /></button>
      </section>

      <!-- 가이드 UI (Figma 1438:4043): 상담 중 관람객이 할 일 -->
      <div class="guide-ui" id="guideUi" hidden><p id="guideText"></p><img id="guideNext" src="/assets/ui/figma/next-guide.svg" alt="" /></div>
      <!-- 김민선 무드보드(S2-1): 오늘의집 집들이에서 저장한 사진 -->
      <aside class="moodboard" id="moodboard" hidden></aside>

      <!-- 캡션 말풍선 (Figma 1433:3440 매니저 · 1434:3719 김민선) -->
      <div class="caption" id="caption" hidden>
        <div class="cap-profile">
          <span class="cap-avatar" id="capAvatar"></span>
          <b class="cap-name" id="captionSpeaker"></b>
        </div>
        <p class="caption-text" id="captionText"></p>
        <img class="cap-next" id="captionNext" alt="다음" />
      </div>

      <div class="tools" id="tools"></div>
      <div class="annotate-bar" id="annotateBar" hidden></div>

      <!-- 오늘의집·상담상세를 볼 때 뒤 공간을 흐리게(Figma 1438:3853의 grey) -->
      <div class="card-dim" id="cardDim" hidden></div>
      <!-- 옵션수정 패널(Figma 1437:3759): 카드 없이 공간 위에 뜬다 -->
      <div class="opt" id="opt" hidden></div>
      <button type="button" class="cta-btn report-cta" id="reportCta" data-target="send-report" hidden>상담 리포트 보내기<img src="/assets/ui/figma/cta-arrow.svg" alt="" /></button>

      <div class="card" id="card" hidden>
        <header class="card-head" id="cardHead"></header>
        <div class="card-body" id="cardBody"></div>
      </div>

      <div class="loading" id="loading" hidden>
        <img class="loading-img" src="/assets/ui/kim-headset.png" alt="XR 헤드셋을 쓰는 김민선" />
        <div class="loading-ring"></div>
        <p>김민선 씨 XR 헤드셋을 착용중</p>
        <span>잠시만 기다려 주세요</span>
      </div>

      <div class="timer" id="timer"></div>
      <nav class="nav" id="nav"></nav>

      <!-- 상담 리포트 (S5-2): 카드는 shared/report.js -->
      <div class="report-wrap" id="report" hidden><div id="reportCard"></div></div>

      <!-- 마무리 (Figma 1254:793): 흐린 사진 배경 + 별 카드 -->
      <section class="outro" id="outro" hidden>
        <img class="outro-bg" src="/assets/cover/outro-bg.jpg" alt="" />
        <div class="outro-card">
          <img class="outro-rays" src="/assets/cover/outro-rays.png" alt="" />
          <img class="outro-star is-l" src="/assets/cover/outro-star-l.png" alt="" />
          <img class="outro-star is-s" src="/assets/cover/outro-star-s.png" alt="" />
          <p class="outro-title">상담을 성공적으로 마무리했습니다!</p>
          <p class="outro-sub">다시 진행을 원하신다면 아래 버튼을 눌러주세요</p>
          <button type="button" class="outro-btn" data-target="restart">처음 화면으로</button>
        </div>
      </section>
    </div>

    <!-- 가이드: 눌러야 할 곳만 밝게 + 펄스 링 + 지시문 -->
    <div class="coach" id="coach" hidden>
      <div class="coach-hole" id="coachHole"></div>
      <div class="coach-label" id="coachLabel"></div>
    </div>

    <!-- 직원용: 왼쪽 위를 2초 길게 누르기 -->
    <div class="staff-zone" id="staffZone"></div>
    <div class="staff" id="staff" hidden></div>
    <div class="idle" id="idle" hidden></div>

    <script type="module" src="/src/tablet/main.js"></script>
  </body>
</html>
