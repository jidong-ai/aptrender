<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- 홈 화면에 추가하면 주소창 없이 열린다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Weave 태블릿" />
    <title>Weave · 태블릿</title>
  </head>
  <body class="tablet">
    <!-- 파노라마(화면 전체) -->
    <div class="view" id="view"></div>
    <!-- 공간에 붙는 표시: 바닥 화살표, 치수, 체크 위치 (화면 px) -->
    <div class="anchor-layer" id="anchors"></div>

    <!-- UI: Figma 매니저 프레임(2264×1292) 좌표. 화면 높이에 맞춰 축소하고, 좌우는 화면 폭만큼 늘어난다 -->
    <div class="ui" id="ui">
      <section class="start" id="start">
        <div class="start-bg" id="startBg"></div>
        <div class="start-body">
          <div class="start-logo" id="startLogo"></div>
          <p class="start-desc">스캔한 우리 집 위에서 바로 보는 인테리어 상담.<br />오늘은 위브 매니저가 되어 고객의 주방을 제안해 보세요.</p>
          <button type="button" class="start-btn" data-target="start">상담 서비스 체험하기<span id="startArrow"></span></button>
        </div>
      </section>

      <div class="caption" id="caption" hidden>
        <span class="caption-speaker" id="captionSpeaker"></span>
        <p class="caption-text" id="captionText"></p>
        <button type="button" class="caption-next" id="captionNext" data-target="caption-next">다음</button>
      </div>

      <div class="tools" id="tools"></div>
      <div class="annotate-bar" id="annotateBar" hidden></div>

      <div class="card" id="card" hidden>
        <header class="card-head" id="cardHead"></header>
        <div class="card-body" id="cardBody"></div>
      </div>

      <div class="loading" id="loading" hidden>
        <div class="loading-ring"></div>
        <p>김민선 씨 XR 헤드셋을 착용중</p>
        <span>잠시만 기다려 주세요</span>
      </div>

      <div class="timer" id="timer"></div>
      <nav class="nav" id="nav"></nav>

      <section class="ending" id="ending" hidden></section>
    </div>

    <!-- 가이드: 눌러야 할 곳만 밝게 + 펄스 링 + 지시문 -->
    <div class="coach" id="coach" hidden>
      <div class="coach-hole" id="coachHole"></div>
      <div class="coach-label" id="coachLabel"></div>
    </div>

    <!-- 직원용: 왼쪽 위를 2초 길게 누르기 -->
    <div class="staff-zone" id="staffZone"></div>
    <div class="staff" id="staff" hidden></div>
    <div class="idle" id="idle" hidden></div>

    <script type="module" src="/src/tablet/main.js"></script>
  </body>
</html>
